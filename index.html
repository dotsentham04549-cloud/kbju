<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>КБЖУ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f2f7;--card:#fff;--card2:#f2f2f7;--tx:#1c1c1e;--mu:#8e8e93;--line:#e5e5ea;--track:#ececf1;
--ac:#34c759;--act:#248a3d;--acbg:rgba(52,199,89,.13);--kc:#34c759;--cp:#0a84ff;--cf:#ff9f0a;--cc:#af52de;--sug:#ff2d55;--fib:#30b0c7;
--bad:#ff3b30;--warn:#c77700;--okt:#248a3d;--modt:#a05a00;--limt:#d70015;
--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);--tabbg:rgba(249,249,251,.86)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--mu:#98989f;--line:#38383a;--track:#2c2c2e;
--ac:#30d158;--act:#30d158;--acbg:rgba(48,209,88,.16);--kc:#30d158;--cp:#0a84ff;--cf:#ff9f0a;--cc:#bf5af2;--sug:#ff375f;--fib:#40c8e0;
--bad:#ff453a;--warn:#ffd60a;--okt:#30d158;--modt:#ffd60a;--limt:#ff6961;--sh:none;--tabbg:rgba(22,22,24,.86)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
main{padding:calc(14px + env(safe-area-inset-top)) 16px 110px;max-width:640px;margin:0 auto}
h2{font-size:22px;font-weight:700;margin:22px 0 8px;letter-spacing:-.3px}
p{margin:6px 0}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card.in{background:var(--card2);box-shadow:none}
button,.btn{font:inherit;font-size:15px;font-weight:600;color:var(--act);background:var(--acbg);border:0;border-radius:12px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:active,.btn:active{opacity:.7}
button.pri{background:var(--ac);color:#fff}
button.danger{color:var(--bad);background:rgba(255,59,48,.1)}
button:disabled{opacity:.45}
.wide{width:100%;margin-top:12px;padding:14px;font-size:16px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.card.in input,.card.in select,.card.in textarea{background:var(--card)}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.gap{gap:8px;flex-wrap:wrap;margin-top:10px}
.grow{flex:1;min-width:0}
.w80{width:80px;flex:none}
.mu{color:var(--mu)}
.sm{font-size:13px}
.mt{margin-top:10px}
.right{text-align:right}
.bad{color:var(--bad)}
.okc{color:var(--okt)}
.warn{color:var(--warn)}
/* шапка дня */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 2px 6px}
.title{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.nav{width:38px;height:38px;border-radius:50%;padding:0;font-size:22px;background:var(--card);color:var(--tx);box-shadow:var(--sh)}
/* главное кольцо */
.hero{padding:18px 14px 16px}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.side{width:72px;text-align:center}
.side .v{font-size:20px;font-weight:700}
.ring-wrap{position:relative;width:176px;height:176px;flex:none}
.ring-wrap svg{display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.macros{display:flex;justify-content:space-around;margin-top:16px}
.mac{text-align:center;width:96px}
.mac .rw{position:relative;width:62px;height:62px;margin:0 auto}
.mac .rw div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.mac b{display:block;font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-top:16px}
.m{font-size:13px}
.bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--ac);transition:width .4s}
.bar i.over{background:var(--bad)!important}
.alc{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,59,48,.1);color:var(--bad);font-size:14px}
/* чипы */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:20px;padding:8px 14px;font-size:14px;flex:none;background:var(--card);color:var(--tx);box-shadow:var(--sh);font-weight:500}
.card.in .chip,.box .chip{background:var(--card2);box-shadow:none}
.hint{font-size:13px;color:var(--mu);margin:2px 4px}
/* приёмы пищи */
.meal{padding:14px 16px}
.meal-h{display:flex;align-items:center;gap:12px}
.mi{width:42px;height:42px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.meal-h b{font-size:17px}
.addc{width:36px;height:36px;border-radius:50%;padding:0;font-size:24px;font-weight:400;flex:none}
.link{background:none;padding:8px 0 0;font-size:14px}
.ent{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.meal .ent:first-of-type{margin-top:10px}
.ent>div:first-child{flex:1;min-width:0}
.ent .k{font-weight:600}
.card.ent{border-top:0;padding:14px 16px}
.list{margin-top:6px}
.list .it{padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:active{opacity:.6}
.star{font-size:22px;color:var(--line);background:none;padding:4px 8px}
.star.on{color:#ffcc00}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;margin-top:12px}
.seg button{flex:1;background:none;color:var(--tx);font-weight:500;padding:8px;border-radius:9px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:600}
/* таббар */
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--tabbg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;border-radius:0;padding:7px 0 9px;font-size:11px;font-weight:500;color:var(--mu);flex-direction:column;gap:2px}
.tabs button span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.55}
.tabs button.on{color:var(--act)}
.tabs button.on span{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:32px;font-weight:300;padding:0;box-shadow:0 6px 18px rgba(52,199,89,.45);z-index:6}
/* шторка */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:10;animation:fade .2s}
.sheet .box{background:var(--card);width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.box:before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.box .x{width:32px;height:32px;border-radius:50%;padding:0;background:var(--card2);color:var(--mu);font-size:15px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.hidden{display:none!important}
.thumb{height:46px;border-radius:10px}
.drow{padding:10px 0;border-bottom:1px solid var(--line)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:9px;margin-right:6px}
.b-ok{background:rgba(52,199,89,.15);color:var(--okt)}.b-mod{background:rgba(255,159,10,.17);color:var(--modt)}.b-lim{background:rgba(255,59,48,.13);color:var(--limt)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
canvas{width:100%;height:190px;display:block}
.prog{position:relative;height:10px;background:var(--track);border-radius:5px;margin:12px 0 6px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:5px}
.prog b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--cf);border-radius:1px}
.kv{display:flex;justify-content:space-between;padding:5px 0}
.appicon{width:52px;height:52px;border-radius:13px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.install b{font-size:17px}
.inst-x{background:none;color:var(--mu);padding:4px 6px;font-size:18px}
ul{margin:6px 0;padding-left:18px}
li{margin:4px 0}
</style>
</head>

/* ===== Утилиты ===== */
const KEY='kbju.v1';
const N=['kcal','p','f','c','sug','fib','alc'];
const MEALS=[['zav','Завтрак'],['obed','Обед'],['per','Перекус'],['uzh','Ужин']];
const $=s=>document.querySelector(s);
const zero=()=>({kcal:0,p:0,f:0,c:0,sug:0,fib:0,alc:0});
const scale=(per,k)=>{const o={};for(const n of N)o[n]=(+per[n]||0)*k;return o};
const addN=(a,b)=>{for(const n of N)a[n]+=(+b[n]||0);return a};
const sumN=arr=>arr.reduce((a,e)=>addN(a,e.n),zero());
const r0=x=>Math.round(+x||0), r1=x=>Math.round((+x||0)*10)/10;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hash=s=>{let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return (h>>>0).toString(36)};
const ds=z=>z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const shift=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return ds(new Date(y,m-1,d+n))};
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
function dLabel(s){if(s===today())return 'Сегодня';if(s===shift(today(),-1))return 'Вчера';const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'})}
function defMeal(){const h=new Date().getHours();return h<11?'zav':h<16?'obed':h<18?'per':'uzh'}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2300)}
function perLine(n){let s=`${r0(n.kcal)} ккал · Б ${r1(n.p)} · Ж ${r1(n.f)} · У ${r1(n.c)}`;if(n.sug>0.4)s+=` · сах ${r1(n.sug)}`;if(n.fib>0.4)s+=` · кл ${r1(n.fib)}`;if(n.alc>0)s+=` · алк ${r1(n.alc)} г`;return s}

const BASE=BASE_RAW.trim().split('\n').map(l=>{const a=l.split(';');return{id:'b'+hash(a[0]),type:'base',name:a[0].trim(),per:{kcal:+a[1],p:+a[2],f:+a[3],c:+a[4],fib:+a[5]||0,sug:+a[6]||0,alc:+a[7]||0},portion:+a[8]||100}});

const DEF={profile:null,over:{},diary:{},weights:[],foods:[],usage:{},ai:{provider:'gemini',gKey:'',gModel:'',key:'',model:'claude-sonnet-5-5'}};
const clone=o=>JSON.parse(JSON.stringify(o));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');const o=Object.assign(clone(DEF),s||{});o.ai=Object.assign(clone(DEF.ai),o.ai||{});return o}catch(e){return clone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить: '+e.message)}}

const allItems=()=>[...S.foods,...BASE];
const getItem=id=>allItems().find(i=>i.id===id);
const sortedW=()=>S.weights.slice().sort((a,b)=>a.d<b.d?-1:1);
const latestW=()=>{const w=sortedW();return w.length?w[w.length-1].w:null};

/* ===== Норма ===== */
function targets(){
  const p=S.profile;if(!p)return null;
  const w=latestW()||p.w, h=p.h/100;
  const bmr=10*w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*p.act;
  const def=Math.min(p.pace*1100,tdee*0.25);
  let kcal=Math.max(tdee-def,p.sex==='m'?1500:1200);kcal=Math.round(kcal/10)*10;
  const ref=Math.min(w,27*h*h);
  const prot=Math.round(1.7*ref);
  let fat=Math.max(0.8*ref,kcal*0.25/9);fat=Math.round(Math.min(fat,kcal*0.30/9));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const t={kcal,p:prot,f:fat,c:carb,sug:25,fib:p.sex==='m'?30:25};
  const auto={...t};
  for(const k in S.over)if(S.over[k]!==''&&S.over[k]!=null&&!isNaN(+S.over[k]))t[k]=+S.over[k];
  return Object.assign(t,{bmr:Math.round(bmr),tdee:Math.round(tdee),auto,w});
}

const TABS=[['diary','🍽','Дневник'],['dish','★','Блюда'],['prog','📈','Прогресс'],['set','⚙','Настройки']];
function render(){

  $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()"><span>${i}</span>${l}</button>`).join('');
  
  ({diary:renderDiary,dish:renderDishes,prog:renderProg,set:renderSettings})[tab]();
  window.scrollTo(0,0);
}
function barH(v,t,mode,col){const pct=t>0?Math.min(100,v/t*100):0;const cls=mode==='max'&&v>t*1.03?'over':'';return `<div class="bar"><i class="${cls}" style="width:${pct}%;${col?'background:'+col:''}"></i></div>`}
function bar(lbl,v,t,mode,col,unit='г'){return `<div class="m"><div class="row sp"><span>${lbl}</span><span class="mu">${r0(v)} / ${mode==='max'?'≤':'≥'}${r0(t)} ${unit}</span></div>${barH(v,t,mode,col)}</div>`}
function ring(sz,sw,v,t,col,canOver){
  const c=sz/2,r=(sz-sw)/2,C=2*Math.PI*r,p=t>0?Math.min(1,v/t):0,over=canOver&&v>t*1.03;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>${p>0?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${over?'var(--bad)':col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`:''}</svg>`;
}
function mac(lbl,v,t,col,canOver){return `<div class="mac"><div class="rw">${ring(62,7,v,t,col,canOver)}<div>${r0(v)}</div></div><b>${lbl}</b><div class="mu sm">из ${r0(t)} г</div></div>`}
const MICON={zav:'🍳',obed:'🍲',per:'🍎',uzh:'🌙'};
function fullDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}

function renderDiary(){
  const t=targets(),day=S.diary[cur]||[],tot=sumN(day),left=t.kcal-tot.kcal;
  let h=`<div class="top"><div onclick="cur=today();render()"><div class="mu sm">${fullDate(cur)}</div><div class="title">${dLabel(cur)}</div></div><div class="row"><button class="nav" onclick="go(-1)">‹</button><button class="nav" onclick="go(1)" ${cur>=today()?'disabled':''}>›</button></div></div>`;
  h+=`<div class="card hero"><div class="hero-top"><div class="side"><div class="v">${r0(tot.kcal)}</div><div class="mu sm">съедено</div></div>
  <div class="ring-wrap">${ring(176,15,tot.kcal,t.kcal,'var(--kc)',true)}<div class="ring-center"><div class="big ${left<0?'bad':''}">${r0(Math.abs(left))}</div><div class="mu sm">${left<0?'ккал сверх нормы':'ккал осталось'}</div></div></div>
  <div class="side"><div class="v">${t.kcal}</div><div class="mu sm">норма</div></div></div>
  <div class="macros">${mac('Белки',tot.p,t.p,'var(--cp)',false)}${mac('Жиры',tot.f,t.f,'var(--cf)',true)}${mac('Углеводы',tot.c,t.c,'var(--cc)',true)}</div>
  <div class="grid2">${bar('Сахар доб.',tot.sug,t.sug,'max','var(--sug)')}${bar('Клетчатка',tot.fib,t.fib,'min','var(--fib)')}</div>
  ${tot.alc>0?`<div class="alc">Алкоголь: ${r1(tot.alc)} г этанола ≈ ${r1(tot.alc/10)} станд. порции</div>`:''}</div>`;
  if(deferredPrompt&&!S.hideInstall)h+=installCard(true);
  const q=quickItems();
  if(q.length)h+=`<div class="chips">${q.map(i=>`<button class="chip" onclick="openPortion('${i.id}')">${i.pinned?'★ ':''}${esc(i.name)}</button>`).join('')}</div>`;
  else h+=`<div class="hint">Отметь ★ свои частые блюда — они появятся здесь кнопками.</div>`;
  const yd=S.diary[shift(cur,-1)]||[];
  for(const[mk,ml]of MEALS){
    const es=day.filter(e=>e.meal===mk),s=sumN(es),y=yd.filter(e=>e.meal===mk);
    h+=`<div class="card meal"><div class="meal-h"><div class="mi">${MICON[mk]}</div><div class="grow"><b>${ml}</b><div class="mu sm">${es.length?`${r0(s.kcal)} ккал · Б ${r0(s.p)} · Ж ${r0(s.f)} · У ${r0(s.c)}`:'пока пусто'}</div></div><button class="addc" onclick="openAdd('${mk}')">＋</button></div>`;
    h+=es.map(e=>`<div class="ent" onclick="editEntry('${e.id}')"><div><div>${e.ai?'<span class="okc">✦</span> ':''}${esc(e.name)}</div><div class="mu sm">${r0(e.g)} г · Б ${r0(e.n.p)} · Ж ${r0(e.n.f)} · У ${r0(e.n.c)}${e.n.sug>0.4?' · сах '+r0(e.n.sug):''}${e.n.alc>0?' · алк '+r1(e.n.alc)+' г':''}</div></div><div class="k">${r0(e.n.kcal)}</div></div>`).join('');
    if(!es.length&&y.length)h+=`<button class="link" onclick="repeatY('${mk}')">↻ Как вчера · ${r0(sumN(y).kcal)} ккал</button>`;
    h+=`</div>`;
  }
  $('#view').innerHTML=h;
}
function go(n){const d=shift(cur,n);if(d>today())return;cur=d;render()}
function quickItems(){
  return allItems().filter(i=>i.pinned||S.usage[i.id]).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(S.usage[b.id]||0)-(S.usage[a.id]||0)).slice(0,12);

/* --- Gemini (бесплатный ключ из Google AI Studio) --- */
async function gfetch(path,body){
  let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/'+path,body?{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':S.ai.gKey.trim()},body:JSON.stringify(body)}:{headers:{'x-goog-api-key':S.ai.gKey.trim()}})}
  catch(e){throw new Error('Нет связи с Gemini. Проверь интернет и VPN.')}
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){const m=(j.error&&j.error.message)||'';
    if(/location is not supported|not supported in your|country|region/i.test(m))throw new Error('Gemini недоступен из этой страны — включи VPN');
    if(/api key|API_KEY/i.test(m)||r.status===401)throw new Error('Неверный ключ Gemini');
    if(r.status===429)throw new Error('Лимит бесплатных запросов на сейчас исчерпан — попробуй через минуту или завтра');
    if(r.status===404){S.ai.gModel='';save();throw new Error('Модель Gemini сменилась — нажми ещё раз')}
    if(r.status===403)throw new Error('Доступ запрещён (403) — проверь VPN и ключ. '+m);
    throw new Error('Gemini: ошибка '+r.status+'. '+m)}
  return j;
}
async function geminiModel(force){
  if(S.ai.gModel&&!force)return S.ai.gModel;
  const ms=[];let tok='';
  do{const j=await gfetch('models?pageSize=200'+(tok?'&pageToken='+tok:''));(j.models||[]).forEach(m=>{if((m.supportedGenerationMethods||[]).includes('generateContent'))ms.push(m.name.replace(/^models\//,''))});tok=j.nextPageToken||''}while(tok);
  const score=n=>{const m=n.match(/^gemini-(\d+(?:\.\d+)?)-flash(.*)$/);if(!m)return -1;const rest=m[2];if(/image|tts|audio|live|embed|thinking|computer|robotics/.test(rest))return -1;let s=parseFloat(m[1])*100;if(/lite/.test(rest))s-=50;if(/preview|exp/.test(rest))s-=40;if(/\d{2,}/.test(rest))s-=3;return s};
  let best='',bs=-1;for(const n of ms){const s=score(n);if(s>bs){bs=s;best=n}}
  if(!best)best=ms.find(n=>/flash/.test(n))||ms.find(n=>/gemini/.test(n))||'';
  if(!best)throw new Error('Не нашёл подходящую модель Gemini для этого ключа');
  S.ai.gModel=best;save();return best;
}
async function callGemini(system,content,maxTokens,json){
  const model=await geminiModel();
  const parts=content.map(c=>c.type==='image'?{inline_data:{mime_type:'image/jpeg',data:c.data}}:{text:c.text});
  const cfg={temperature:0.2,maxOutputTokens:Math.max(maxTokens,1024)};if(json)cfg.responseMimeType='application/json';
  const j=await gfetch(`models/${model}:generateContent`,{system_instruction:{parts:[{text:system}]},contents:[{role:'user',parts}],generationConfig:cfg});
  const cand=(j.candidates||[])[0];
  if(!cand){const br=j.promptFeedback&&j.promptFeedback.blockReason;throw new Error('Gemini не ответил'+(br?' ('+br+')':''))}
  const txt=((cand.content&&cand.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('');
  if(!txt)throw new Error('Пустой ответ Gemini'+(cand.finishReason?' ('+cand.finishReason+')':'')+' — попробуй ещё раз');
  return txt;
}

/* --- Claude (платный ключ Anthropic) --- */
async function callClaude(system,content,maxTokens){
  content=content.map(c=>c.type==='image'?{type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.data}}:c);
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.ai.model.trim()||DEF.ai.model,max_tokens:maxTokens,system,messages:[{role:'user',content}]})});
  }catch(e){throw new Error('Нет связи с API. Проверь интернет и VPN.')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}
    if(r.status===401)throw new Error('Неверный API-ключ');
    if(r.status===403)throw new Error('Доступ запрещён (403) — включи VPN. '+m);
    if(r.status===404)throw new Error('Модель не найдена — проверь название модели в настройках. '+m);
    throw new Error('Ошибка '+r.status+': '+m)}
  const j=await r.json();return j.content.filter(b=>b.type==='text').map(b=>b.text).join('');
}

function avgW(fromAgo,toAgo){const t=dayNum(today());const xs=S.weights.filter(w=>{const a=t-dayNum(w.d);return a>=fromAgo&&a<=toAgo});return xs.length?xs.reduce((s,w)=>s+w.w,0)/xs.length:null}
function renderProg(){

  const a1=avgW(0,6),a0=avgW(7,13),curW=a1??latestW()??w0;
  const lost=w0-curW,pct=lost/w0*100,span=ws.length?dayNum(ws[ws.length-1].d)-dayNum(ws[0].d):0;
  let pace='';

    if(r>1.0)pace=`<div class="warn">Снижение ${r1(r)} кг/нед — быстрее 1 кг. Для печени лучше плавнее: можно добавить 100–200 ккал.</div>`;
    else if(r>=0.3)pace=`<div class="okc">Темп ${r1(r)} кг/нед — то, что нужно.</div>`;
    else if(r>-0.2&&span>=14)pace=`<div class="warn">Вес почти стоит (${r1(r)} кг/нед). Если так держится 2+ недели — проверь, всё ли записываешь, или снизь норму на 100–150 ккал в настройках.</div>`;
    else if(r<=-0.2)pace=`<div class="bad">Вес растёт (+${r1(-r)} кг/нед).</div>`;
    else pace=`<div class="mu">Темп ${r1(r)} кг/нед. Нужно чуть больше данных.</div>`;
  }else pace=`<div class="mu sm">Взвешивайся утром натощак хотя бы 3–4 раза в неделю — через 2 недели появится темп.</div>`;
  // неделя питания
  const days=[];for(let i=0;i<7;i++){const d=S.diary[shift(today(),-i)];if(d&&d.length)days.push(sumN(d))}
  const wk=days.reduce((a,b)=>addN(a,b),zero()),nd=days.length||1;
  let alcW=0;for(let i=0;i<7;i++)alcW+=sumN(S.diary[shift(today(),-i)]||[]).alc;
  const t=targets();

  <div class="card"><div class="row sp"><span>Старт</span><b>${r1(w0)} кг</b></div><div class="row sp"><span>Сейчас (ср. 7 дн.)</span><b>${r1(curW)} кг</b></div><div class="row sp"><span>Снижено</span><b class="${lost>0?'okc':''}">${r1(lost)} кг · ${r1(pct)}%</b></div>

  <div class="row sp mu sm"><span>0%</span><span>−7% · ${r1(w0*0.93)} кг</span><span>−10% · ${r1(w0*0.9)} кг</span></div>

  <div class="row sp"><span>Калории</span><b>${r0(wk.kcal/nd)} / ${t.kcal}</b></div><div class="row sp"><span>Белки</span><b>${r0(wk.p/nd)} / ${t.p} г</b></div><div class="row sp"><span>Сахар доб.</span><b class="${wk.sug/nd>t.sug?'bad':''}">${r0(wk.sug/nd)} / ≤${t.sug} г</b></div><div class="row sp"><span>Клетчатка</span><b class="${wk.fib/nd<t.fib*0.7?'warn':''}">${r0(wk.fib/nd)} / ≥${t.fib} г</b></div>`:'<div class="mu">Пока нет записей</div>'}
  <div class="row sp mt"><span>Алкоголь за неделю</span><b class="${alcW>0?'bad':'okc'}">${alcW>0?r1(alcW)+' г этанола ≈ '+r1(alcW/10)+' порц.':'0 — отлично'}</b></div></div>
  <h2>История</h2><div class="card">${ws.slice().reverse().slice(0,40).map(w=>`<div class="ent"><div>${dLabel(w.d)}</div><div>${r1(w.w)} кг <button class="star" style="font-size:14px" onclick="delWeight('${w.d}')">✕</button></div></div>`).join('')||'<div class="mu">Пусто</div>'}</div>`;

function addWeight(){const v=parseFloat(String($('#wv').value).replace(',','.')),d=$('#wd').value||today();if(!(v>30&&v<350))return toast('Проверь вес');S.weights=S.weights.filter(x=>x.d!==d);S.weights.push({d,w:v});save();render();toast('Записано')}
function delWeight(d){if(!confirm('Удалить запись веса?'))return;S.weights=S.weights.filter(x=>x.d!==d);save();render()}
function drawChart(){
  const cv=$('#wch');if(!cv)return;const ws=sortedW(),dpr=devicePixelRatio||1,W=cv.clientWidth,H=190;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),cv_=n=>cs.getPropertyValue(n).trim();
  x.font='12px system-ui';x.fillStyle=cv_('--mu');
  if(ws.length<2){x.fillText('Нужно хотя бы 2 взвешивания',10,H/2);return}
  const d0=dayNum(ws[0].d),d1=dayNum(ws[ws.length-1].d),span=Math.max(1,d1-d0);
  let mn=Math.min(...ws.map(w=>w.w)),mx=Math.max(...ws.map(w=>w.w));mn-=0.5;mx+=0.5;
  const px=d=>34+(d-d0)/span*(W-44),py=v=>10+(mx-v)/(mx-mn)*(H-30);
  x.strokeStyle=cv_('--line');x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=py(v);x.beginPath();x.moveTo(30,y);x.lineTo(W,y);x.stroke();x.fillText(r1(v),0,y+4)}
  x.fillText(dLabel(ws[0].d),34,H-4);const l=dLabel(ws[ws.length-1].d);x.fillText(l,W-x.measureText(l).width-2,H-4);
  const avg=ws.map(w=>{const dn=dayNum(w.d),xs=ws.filter(z=>{const a=dn-dayNum(z.d);return a>=0&&a<7});return{dn,v:xs.reduce((s,z)=>s+z.w,0)/xs.length}});
  x.strokeStyle=cv_('--kc');x.lineWidth=3;x.lineJoin='round';x.beginPath();avg.forEach((a,i)=>{const X=px(a.dn),Y=py(a.v);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke();
  x.fillStyle=cv_('--mu');ws.forEach(w=>{x.beginPath();x.arc(px(dayNum(w.d)),py(w.w),2.5,0,7);x.fill()});
}

function saveProfile(){
  const p={sex:$('#sx').value,age:+$('#ag').value,h:+$('#hh').value,w:+String($('#ww').value).replace(',','.'),act:+$('#ac').value,pace:+$('#pc').value};
  if(!(p.age>=14&&p.age<100))return toast('Проверь возраст');if(!(p.h>120&&p.h<230))return toast('Проверь рост');if(!(p.w>35&&p.w<350))return toast('Проверь вес');
  const first=!S.profile;S.profile=p;
  if(!S.weights.length)S.weights.push({d:today(),w:p.w});
  save();if(first){tab='diary';toast('Норма посчитана: '+targets().kcal+' ккал')}else toast('Сохранено');render();
}
function saveOver(){for(const k of['kcal','p','f','c','sug','fib']){const v=$('#ov_'+k).value;if(v==='')delete S.over[k];else S.over[k]=+v}save();render();toast('Сохранено')}
function saveAI(silent){
  if($('#gk')){const k=$('#gk').value.trim();if(k!==S.ai.gKey){S.ai.gKey=k;S.ai.gModel=''}}
  if($('#ak')){S.ai.key=$('#ak').value.trim();S.ai.model=$('#am2').value.trim()||DEF.ai.model}
  save();if(!silent)toast('Сохранено');
}
async function testAI(){
  saveAI(true);if(!aiReady())return toast('Вставь ключ');toast('Проверяю…');
  try{
    if(S.ai.provider!=='claude')await geminiModel(true);

    toast('✓ ИИ работает'+(S.ai.provider!=='claude'?': '+S.ai.gModel:''));if(tab==='set')renderSettings();

}
function exportData(){const b=new Blob([JSON.stringify({...S,ai:{...S.ai,key:''}},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kbju-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.diary)throw 0;if(!confirm('Заменить текущие данные копией?'))return;const key=S.ai.key;S=Object.assign(clone(DEF),o);S.ai=Object.assign(clone(DEF.ai),o.ai||{});if(!S.ai.key)S.ai.key=key;save();render();toast('Загружено')}catch(e){toast('Это не файл копии')}};r.readAsText(f)}
function resetAll(){if(confirm('Точно стереть всё: дневник, вес, блюда?')&&confirm('Это необратимо. Стереть?')){localStorage.removeItem(KEY);S=load();seedStarter();render()}}

function seedStarter(){
  if((S.starterV||0)>=STARTER_V)return;
  const B=n=>{const b=BASE.find(x=>x.name===n);if(!b)throw new Error('нет в базе: '+n);return b};
  for(const d of STARTER){
    const id='st_'+d.k;if(S.foods.some(f=>f.id===id))continue;let f;
    if(d.ing){f={id,type:'dish',name:d.name,ing:d.ing.map(([n,g])=>({name:B(n).name,g,per:{...B(n).per}})),total:d.total||'',portion:0,pinned:!!d.pin};const c=dishCalc(f);f.portion=d.portion||Math.round(c.sg);f.per=c.per}
    else if(d.base){f={id,type:'food',name:d.name,per:{...B(d.base).per},portion:d.portion,pinned:!!d.pin}}
    else{const[k,p,fa,c,sug=0,fib=0]=d.per;f={id,type:'food',name:d.name,per:{kcal:k,p,f:fa,c,sug,fib,alc:0},portion:d.portion,pinned:!!d.pin}}
    if(d.note)f.note=d.note;S.foods.push(f);
  }
  S.starterV=STARTER_V;save();
}

/* ===== Установка приложения ===== */
let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if($('#sheet').classList.contains('hidden'))render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('✓ Приложение установлено — ищи иконку КБЖУ');render()});
function installCard(compact){
  if(isStandalone())return '';
  if(compact)return `<div class="card install"><div class="row"><img src="icon-192.png" class="appicon" alt=""><div class="grow"><b>Установить КБЖУ</b><div class="mu sm">Иконка на рабочем столе, без браузера</div></div><button class="inst-x" onclick="S.hideInstall=true;save();render()">✕</button></div><button class="pri wide" onclick="installApp()">Установить приложение</button></div>`;
  return `<div class="card install"><div class="row"><img src="icon-192.png" class="appicon" alt=""><div class="grow"><b>Установить КБЖУ</b><div class="mu sm">Своя иконка на рабочем столе, открывается на весь экран, работает без интернета</div></div></div>
  ${deferredPrompt?`<button class="pri wide" onclick="installApp()">Установить приложение</button>`
  :`<div class="card in sm mt"><b>Если кнопки установки нет:</b><br>Chrome на Android: меню <b>⋮</b> → «Установить приложение» или «Добавить на главный экран».<br>iPhone (Safari): «Поделиться» → «На экран Домой».<br><span class="mu">Кнопка появляется, когда Chrome разрешит установку — обычно сразу, иногда после пары открытий страницы.</span></div>`}</div>`;
}
async function installApp(){
  if(!deferredPrompt)return toast('Используй меню ⋮ → «Добавить на главный экран»');
  deferredPrompt.prompt();
  try{const r=await deferredPrompt.userChoice;if(r.outcome!=='accepted')toast('Установка отменена')}catch(e){}
  deferredPrompt=null;render();
}

seedStarter();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
