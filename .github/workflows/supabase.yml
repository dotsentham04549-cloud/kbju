# Автозаливка функции-посредника КБЖУ на Supabase.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens → Generate new token
#   SUPABASE_PROJECT_REF  — ID проекта (Project Settings → General → Project ID)
#   GIGACHAT_KEY          — Authorization Key из developers.sber.ru (основной ИИ)
#   GEMINI_KEY            — ключ Gemini (запасной, если GigaChat не задан)
#   APP_TOKEN             — токен приложения (кнопка «Сгенерировать» в КБЖУ → Настройки → ИИ)
# Запуск: сам при изменении функции, или вручную — Actions → «Supabase: посредник ИИ» → Run workflow
# (вручную — после того как добавил или поменял секреты).

name: "Supabase: посредник ИИ"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Проверка секретов
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Секреты SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF ещё не добавлены — пропускаю заливку."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: latest

      - name: Секреты функции (ключи ИИ, токен приложения)
        if: steps.chk.outputs.ok == 'true'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          GIGACHAT_KEY: ${{ secrets.GIGACHAT_KEY }}
        run: |
          args=()
          [ -n "$GEMINI_KEY" ] && args+=("GEMINI_KEY=$GEMINI_KEY")
          [ -n "$APP_TOKEN" ] && args+=("APP_TOKEN=$APP_TOKEN")
          [ -n "$GIGACHAT_KEY" ] && args+=("GIGACHAT_KEY=$GIGACHAT_KEY")
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"
          else
            echo "::warning::Ключи ИИ и APP_TOKEN не заданы в GitHub — оставляю секреты Supabase как есть."
          fi

      - name: Заливка функции ai
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy ai --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Адрес функции
        if: steps.chk.outputs.ok == 'true'
        run: echo "::notice::Готово. Адрес функции — https://${PROJECT_REF}.supabase.co/functions/v1/ai (в приложение можно вписать просто ID проекта)."
